services:
  currency-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: currency-service:1.0.0
    container_name: currency-service-hardened
    env_file:
      - .env
    ports:
      - "8000:8000"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    pids_limit: 100

    mem_limit: 512m
    cpus: 0.5

    networks:
      - app-net
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/info')"
        ]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  app-net:
    driver: bridge