---
apiVersion: v1
kind: Service
metadata:
  name: currency-service
spec:
  type: {{ .Values.service.type }}
  selector:
    app: currency-service
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8000
    {{- if eq .Values.service.type "NodePort" }}
    nodePort: {{ .Values.service.nodePort }}
    {{- end }}
