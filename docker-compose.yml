services:
  currency-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: z0leg/currency-service:${IMAGE_TAG}
    container_name: currency-service
    env_file:
      - .env
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/info')"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
