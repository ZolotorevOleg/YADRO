---
- name: Install kubeadm
  ansible.builtin.apt:
    name: kubeadm
    state: present
    update_cache: true
  become: true

- name: Hold kubeadm package
  ansible.builtin.dpkg_selections:
    name: kubeadm
    selection: hold
  become: true

- name: Initialize Kubernetes cluster (master)
  ansible.builtin.command: >
    kubeadm init
    --cri-socket={{ kubeadm_cri_socket }}
    --pod-network-cidr={{ kubeadm_pod_network_cidr }}
  args:
    creates: /etc/kubernetes/admin.conf
  when: "'k8s_control_plane' in group_names"
  register: kubeadm_init_output
  become: true

- name: Create .kube directory
  ansible.builtin.file:
    path: /home/{{ ansible_user }}/.kube
    state: directory
    mode: "0755"
  when: "'k8s_control_plane' in group_names"
  become: true

- name: Copy admin.conf to user kube config
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: /home/{{ ansible_user }}/.kube/config
    remote_src: true
    owner: "{{ ansible_user }}"
    mode: "0644"
  when: "'k8s_control_plane' in group_names"
  become: true

- name: Get join command
  ansible.builtin.command: kubeadm token create --print-join-command
  when: "'k8s_control_plane' in group_names"
  register: join_command_raw
  changed_when: false
  become: true

- name: Check if worker node is already registered in cluster
  ansible.builtin.command: >
    kubectl get node {{ inventory_hostname }}
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  delegate_to: "{{ groups['k8s_control_plane'][0] }}"
  register: worker_node_check
  changed_when: false
  failed_when: false
  when: "'k8s_workers' in group_names"
  become: true

- name: Set join command fact
  ansible.builtin.set_fact:
    kubeadm_join_command: "{{ join_command_raw.stdout }}"
  when: "'k8s_control_plane' in group_names"

- name: Reset worker before join
  ansible.builtin.command: >
    kubeadm reset -f --cri-socket={{ kubeadm_cri_socket }}
  when:
    - "'k8s_workers' in group_names"
    - worker_node_check.rc != 0
  become: true

- name: Stop kubelet on workers before cleanup
  ansible.builtin.service:
    name: kubelet
    state: stopped
  when:
    - "'k8s_workers' in group_names"
    - worker_node_check.rc != 0
  become: true

- name: Remove old Kubernetes directories on workers
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/kubernetes/kubelet.conf
    - /etc/kubernetes/bootstrap-kubelet.conf
    - /etc/kubernetes/pki
    - /var/lib/etcd
  when:
    - "'k8s_workers' in group_names"
    - worker_node_check.rc != 0
  become: true

- name: Recreate kubelet directory on workers
  ansible.builtin.file:
    path: /var/lib/kubelet
    state: directory
    mode: "0755"
  when:
    - "'k8s_workers' in group_names"
    - worker_node_check.rc != 0
  become: true

- name: Join worker nodes to cluster
  ansible.builtin.command: >
    {{ hostvars[groups['k8s_control_plane'][0]].kubeadm_join_command }}
    --cri-socket={{ kubeadm_cri_socket }}
  when:
    - "'k8s_workers' in group_names"
    - worker_node_check.rc != 0
  args:
    creates: /etc/kubernetes/kubelet.conf
  become: true

- name: Wait for API server to be ready
  ansible.builtin.command: kubectl get nodes
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: api_ready
  retries: 10
  delay: 10
  until: api_ready.rc == 0
  when: "'k8s_control_plane' in group_names"
  changed_when: false
  become: true

- name: Check if Calico daemonset exists
  ansible.builtin.command: kubectl get daemonset calico-node -n kube-system
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: calico_check
  failed_when: false
  changed_when: false
  when: "'k8s_control_plane' in group_names"
  become: true

- name: Install CNI plugin
  ansible.builtin.command: >
    kubectl apply -f {{ kubeadm_cni_url }}
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  when:
    - "'k8s_control_plane' in group_names"
    - kubeadm_install_cni
    - calico_check.rc != 0
  become: true
