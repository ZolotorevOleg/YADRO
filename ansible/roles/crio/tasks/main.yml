---
- name: Configure apt proxy
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/95proxy
    mode: "0644"
    content: |
      Acquire::http::Proxy "http://{{ proxy_host }}:{{ proxy_port }}";
      Acquire::https::Proxy "http://{{ proxy_host }}:{{ proxy_port }}";
  when: proxy_enabled
  become: true
  no_log: true

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ crio_base_packages }}"
    state: present
    update_cache: true
  become: true

- name: Ensure apt keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  become: true

- name: Add Kubernetes apt key
  ansible.builtin.shell: |
    curl -fsSL https://pkgs.k8s.io/core:/stable:/{{ crio_kubernetes_version }}/deb/Release.key \
      | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
  args:
    creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
  become: true

- name: Add Kubernetes repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/kubernetes.list
    mode: "0644"
    content: |
      deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/{{ crio_kubernetes_version }}/deb/ /
  become: true

- name: Add CRI-O apt key
  ansible.builtin.shell: |
    curl -fsSL https://download.opensuse.org/repositories/isv:/cri-o:/stable:/{{ crio_version }}/deb/Release.key \
      | gpg --dearmor -o /etc/apt/keyrings/cri-o-apt-keyring.gpg
  args:
    creates: /etc/apt/keyrings/cri-o-apt-keyring.gpg
  become: true

- name: Add CRI-O repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/cri-o.list
    mode: "0644"
    content: |
      deb [signed-by=/etc/apt/keyrings/cri-o-apt-keyring.gpg] https://download.opensuse.org/repositories/isv:/cri-o:/stable:/{{ crio_version }}/deb/ /
  become: true

- name: Disable swap
  ansible.builtin.command: swapoff -a
  when: crio_disable_swap
  changed_when: false
  become: true

- name: Remove swap from fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '^\s*[^#].*\s+swap\s+'
    state: absent

- name: Configure kernel modules for Kubernetes
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    mode: "0644"
    content: |
      overlay
      br_netfilter
  become: true

- name: Load overlay module
  ansible.builtin.command: modprobe overlay
  changed_when: false
  become: true

- name: Load br_netfilter module
  ansible.builtin.command: modprobe br_netfilter
  changed_when: false
  become: true

- name: Configure sysctl for Kubernetes networking
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-kubernetes-cri.conf
    mode: "0644"
    content: |
      net.bridge.bridge-nf-call-iptables = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward = 1
  notify: Apply sysctl
  become: true

- name: Install CRI-O packages
  ansible.builtin.apt:
    name: "{{ crio_packages }}"
    state: present
    update_cache: true
  become: true

- name: Enable and start CRI-O
  ansible.builtin.service:
    name: crio
    enabled: "{{ crio_enable_service }}"
    state: "{{ 'started' if crio_start_service else omit }}"
  become: true
